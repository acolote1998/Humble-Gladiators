<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gladiator Forge</title>

    <!-- Bootstrap CSS for styling and responsive layout -->
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/dynamicHPbars.css" rel="stylesheet" />

    <!-- Custom CSS for additional styling -->
    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Stes up the header image  -->
    <div
      id="imageHeader"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: solid 2px black;
      "
    >
      <h1 class="letrasRomanasTitle" id="HeaderText">Humble Gladiators</h1>
    </div>

    <!-- Character Creation Screen -->
    <div
      id="characterCreationScreen"
      class="container"
      style="padding-top: 25px"
    >
      <!-- Row for gladiator input fields and stats -->
      <div class="row">
        <!-- Column for gladiator stats 
        <div
          id="gladiatorStats"
          class="col d-flex flex-column justify-content-center align-items-center"
        >
          <h2>Gladiator's Stats:</h2>

          <h3>Strength:</h3>
          <div>
            <input class="inputs" readonly id="heroStrength" />
          </div>

          <h3>Dexterity:</h3>
          <div>
            <input class="inputs" readonly id="heroDexterity" />
          </div>

          <h3>HP:</h3>
          <div>
            <input class="inputs" readonly id="heroHP" />
          </div>
        </div>
        -->

        <!-- Column for displaying the gladiator's visual result -->
        <div
          id="heroImgDiv"
          class="col d-flex flex-column justify-content-center align-items-center niceBorder"
        >
          <!-- Row for gladiator's Name -->
          <div class="row" id="divheroName">
            <span class="titulo crimsonFont" id="heroName" style="padding: 5px"
              >Test</span
            >
          </div>
          <div class="row" id="divheroLevel">
            <span class="crimsonFont" id="heroLevel" style="padding: 5px"
              >Test</span
            >
          </div>
          <!-- Row for gladiator's HP bar -->
          <div
            class="row"
            id="divheroHPBarCreationScreen"
            style="
              background-size: cover;
              background-size: 100% 100%;
              padding: 10px;
            "
          >
            <input
              id="heroHPBarCreationScreen"
              style="
                text-align: center;
                font-family: fantasy;
                font-size: 30px;
                pointer-events: none;
              "
              class="hpBarGreenColor"
              placeholder=""
              readonly
            />
            <br />
          </div>

          <!-- Row for gladiator's face -->
          <div
            class="row"
            id="heroFace"
            style="background-size: cover; background-size: 100% 100%"
          ></div>

          <!-- Row for gladiator's body -->
          <div
            class="row"
            id="heroBody"
            style="background-size: cover; background-size: 100% 100%"
          ></div>
        </div>
        <!--                  -->

        <div
          id="heroRightColumnDiv"
          class="col d-flex flex-column justify-content-top align-items-center niceBorder"
          style="padding-top: 20px; max-height: 714px; overflow-y: auto"
        ></div>
        <!-- Column for displaying the gladiator's visual result -->
      </div>
      <div class="row">
        <div
          id="homeButtons"
          class="col d-flex flex-row justify-content-center align-items-center niceBorder"
        >
          <button class="crimsonFont" onclick="goingHome()">Home</button>
        </div>
      </div>
    </div>

    <!-- Custom JavaScript for functionality -->
    <script src="js/helpers.js"></script>
    <script src="js/podium.js"></script>
    <script src="js/GladiatorClass.js"></script>

    <!-- Bootstrap JS and dependencies for additional functionality -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
